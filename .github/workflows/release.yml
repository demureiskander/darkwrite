name: Release desktop apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

env:
  CI: false
  # Release builds are intentionally unsigned until the project obtains an
  # Apple Developer certificate. This keeps macOS packaging deterministic.
  CSC_IDENTITY_AUTO_DISCOVERY: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-14
            artifact: macos
          - name: Windows
            runner: windows-latest
            artifact: windows
          - name: Linux
            runner: ubuntu-22.04
            artifact: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies (Windows)
        run: |
          pip install setuptools
        if: runner.os == 'Windows'

      - name: Build
        run: pnpm build

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            packages/app-desktop/release/*/*.exe
            packages/app-desktop/release/*/*.dmg
            packages/app-desktop/release/*/*.AppImage
            packages/app-desktop/release/*/*.deb
            packages/app-desktop/release/*/*.tar.zst
            packages/app-desktop/release/*/*.rpm
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          files: release-files/*
          generate_release_notes: true
          draft: false
